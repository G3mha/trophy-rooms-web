<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .tile {
    position: relative; width: 1024px; height: 1024px; overflow: hidden;
    border-radius: 180px; /* squared off for apple-icon via ?square */
    background:
      repeating-linear-gradient(90deg, rgba(255,232,190,0.020) 0 8px, transparent 8px 28px),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0 12px, transparent 12px 360px),
      linear-gradient(90deg, #241509 0%, #33200f 22%, #2a1a0c 47%, #362211 71%, #241509 100%);
  }
  .square .tile { border-radius: 0; }
  /* warm spotlight from above + edge vignette */
  .light { position: absolute; inset: 0; background:
      radial-gradient(ellipse 70% 34% at 50% 16%, rgba(255, 208, 138, 0.25), transparent 70%),
      radial-gradient(ellipse 105% 100% at 50% 45%, transparent 55%, rgba(10, 5, 2, 0.55) 100%); }
  /* backlit pool behind the cup - the contrast mechanism at 16px */
  .glow { position: absolute; inset: 0; background:
      radial-gradient(ellipse 85% 72% at 50% 44%, rgba(255, 196, 116, 0.80), rgba(255, 190, 110, 0.25) 55%, transparent 80%); }
  .shelf { position: absolute; bottom: 0; left: 0; width: 1024px; height: 56px;
      background: linear-gradient(180deg, #e8d5ac 0%, #b08d54 18%, #5c3f22 55%, #2a1a0c 100%); }
  .sil { position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%); }
  .sil path, .sil rect { fill: #0d0805; }
</style>
</head>
<body>
<div class="tile">
  <div class="light"></div>
  <div class="glow"></div>
  <div class="shelf"></div>
  <div class="sil">
    <svg width="430" height="747" viewBox="0 0 95 165">
      <path d="M12 6 h71 v27 c0 33 -16 51 -35 51 c-19 0 -36 -18 -36 -51 z"/>
      <path d="M41 84 h13 l6 24 h-25 z"/>
      <rect x="26" y="108" width="43" height="11" rx="3"/>
      <rect x="18" y="119" width="59" height="46" rx="4"/>
    </svg>
  </div>
</div>
<script>
  if (location.search.includes("square")) document.body.classList.add("square");
</script>
</body>
</html>
